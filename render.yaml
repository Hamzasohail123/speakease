# Render Blueprint for SpeakEase
# This file enables one-click deployment

services:
  # Backend API Service
  - type: web
    name: speakease-backend
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=shared && npm run db:generate --workspace=backend && npm run build --workspace=backend
    startCommand: cd backend && npm run db:migrate:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: speakease-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health

databases:
  # PostgreSQL Database
  - name: speakease-db
    databaseName: speakease
    user: speakease_user
    plan: free
    region: oregon
    postgresMajorVersion: 15
